# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting

runConfig:
  # 💰 cpu: 1 (كان 2) — الـ HTML يُمتَص من Cloudflare Worker على الحافة؛ عمل الـ origin
  #    الفعلي هو إعادة توليد ISR وترميز الصور فقط، وفيهما الـ vCPU الثاني كان يشتري
  #    زمن استجابة لا قدرة. الذاكرة تبقى 1024 (هامش sharp/ISR). بعد النشر شغّل
  #    warm-cache.ts مرة لإعادة تدفئة ISR (سيستغرق أطول قليلاً — طبيعي).
  cpu: 1
  memoryMiB: 1024
  concurrency: 100

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDCQvgrOH20mKVi-kMxWRX81plHZgzHpRg
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: prokr-84ca8.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: prokr-84ca8
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: prokr-84ca8.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "485926356771"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:485926356771:web:24bca0fe2ce51450c12e96
  - variable: NEXT_PUBLIC_GSC_ID
    value: "Ed3SDlm2dwURmwiI8W3KF167qVrunVCBy4_02QBKKMA"
